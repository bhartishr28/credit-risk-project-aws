
name: Credit Risk Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        run: python -m pytest -v

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build FastAPI Docker image
        run: docker build -f Dockerfile.api -t credit-risk-api .

      - name: Build Streamlit Docker image
        run: docker build -f Dockerfile.frontend -t credit-risk-frontend .
